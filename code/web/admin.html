<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản trị</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="khung">
  <div class="the gon phang">
    <div class="bao" id="chon-muc"></div>
  </div>
  <div id="noi-dung"></div>
</div>

<script src="/static/common.js"></script>
<script>
const nd = chiGiaoVien();
dungKhung("Quản lý nội dung", "Học liệu, đề thi và ca thi");
if (!nd) throw new Error("dung lai");

const MUC = [
  { ma: "tong-quan", ten: "Tổng quan", ve: veTongQuan },
  { ma: "hoc-sinh", ten: "Học sinh", ve: veHocSinh },
  { ma: "hoc-lieu", ten: "Học liệu", ve: veHocLieu },
  { ma: "de-thi",   ten: "Đề thi",   ve: veDeThi },
  { ma: "ca-thi",   ten: "Ca thi",   ve: veCaThi },
  { ma: "du-lieu",  ten: "Dữ liệu nghiên cứu", ve: veDuLieu },
  { ma: "nhat-ky",  ten: "Nhật ký", ve: veNhatKy },
];
const oNoiDung = document.getElementById("noi-dung");
let mucDangXem = "tong-quan";
let hzTongQuan = null, hzCa = null;       // tự làm mới tổng quan và danh sách ca khi đang xem

function veChonMuc() {
  document.getElementById("chon-muc").innerHTML = MUC.map(m =>
    `<button class="${m.ma === mucDangXem ? "" : "phu"} nho" data-muc="${m.ma}">${m.ten}</button>`
  ).join("");
  document.querySelectorAll("button[data-muc]").forEach(b => {
    b.onclick = () => { mucDangXem = b.dataset.muc; veChonMuc(); veMuc(); };
  });
}

function veMuc() {
  clearInterval(hzTongQuan); clearInterval(hzCa);
  oNoiDung.innerHTML = khungXuong(3);
  MUC.find(m => m.ma === mucDangXem).ve();
}

// ======================================================== mục 1: học liệu
let trangDoan = 1;
const daChon = new Set();            // đoạn được chọn để sửa hoặc xóa hàng loạt; giữ khi sang trang khác
let doanTrenTrang = [];
const TOI_DA_MOT_LAN = 200;          // khớp giới hạn của máy chủ

async function veHocLieu() {
  daChon.clear();
  oNoiDung.innerHTML = `
    <div class="the">
      <h2>Nạp đề cương</h2>
      <p class="mo">Tải lên đề cương Word, văn bản hoặc Markdown. Sau khi tải,
         thầy cô có thể kiểm tra và chỉnh lại môn, chương, bài hoặc dạng bài.</p>
      <div class="hang">
        <div class="o" style="flex-basis:150px">
          <label for="mon-nap">Môn</label>
          <select id="mon-nap">
            <option value="Toán">Toán</option>
            <option value="Vật lí">Vật lí</option>
          </select>
        </div>
        <div class="o">
          <label for="tep">Chọn file</label>
          <input type="file" id="tep" accept=".docx,.txt,.md">
        </div>
        <button id="nut-nap-tep">Nạp vào kho</button>
      </div>
      <div id="tien-do-nap" class="an cach-nho" aria-live="polite">
        <div class="thanh luc"><i id="tien-do-nap-i" style="width:0%"></i></div>
        <p class="mo-nho" id="tien-do-nap-chu"></p>
      </div>
      <div id="ket-qua-nap" class="cach-nho"></div>
    </div>

    <div class="the">
      <div class="gon-gang" style="margin-bottom:12px">
        <h2 style="margin:0">Các đoạn trong kho</h2>
        <span class="mo-nho" id="tong-doan"></span>
      </div>
      <div class="thanh-loc" role="search">
        <div class="o tim-kiem">
          <label for="tim-doan">Tìm trong học liệu</label>
          <input id="tim-doan" type="search" autocomplete="off"
                 placeholder="Từ khóa trong chương, bài, dạng bài hoặc nội dung" maxlength="100">
        </div>
        <div class="o">
          <label for="loc-mon">Môn</label>
          <select id="loc-mon">
            <option value="">Tất cả môn</option>
            <option value="Toán">Toán</option>
            <option value="Vật lí">Vật lí</option>
          </select>
        </div>
        <div class="o">
          <label for="loc-chuong">Chương</label>
          <select id="loc-chuong"><option value="">Tất cả chương</option></select>
        </div>
        <button class="nhe" id="xoa-loc">Xóa bộ lọc</button>
      </div>
      <div id="thanh-chon" class="thanh-chon an" role="region" aria-label="Thao tác hàng loạt" aria-live="polite"></div>
      <div id="bang-doan"></div>
      <div class="giua cach" id="phan-trang"></div>
    </div>`;

  document.getElementById("nut-nap-tep").onclick = napTep;
  let henTim = null;
  document.getElementById("tim-doan").oninput = () => {
    clearTimeout(henTim);
    henTim = setTimeout(() => napDanhSachDoan(1), 300);
  };
  document.getElementById("loc-mon").onchange = async () => { await napChuong(); napDanhSachDoan(1); };
  document.getElementById("loc-chuong").onchange = () => napDanhSachDoan(1);
  document.getElementById("xoa-loc").onclick = async () => {
    document.getElementById("tim-doan").value = "";
    document.getElementById("loc-mon").value = "";
    document.getElementById("loc-chuong").value = "";      // napChuong giữ chương đang chọn nếu còn
    await napChuong();
    napDanhSachDoan(1);
  };
  await napChuong();
  napDanhSachDoan(1);
}

// Danh sách chương lấy từ kho, theo môn đang chọn. Giữ lại chương đang chọn nếu còn.
async function napChuong() {
  const o = document.getElementById("loc-chuong");
  const dang = o.value;
  const mon = document.getElementById("loc-mon").value;
  try {
    const ds = await API.get("/api/admin/hoc-lieu/chuong" + (mon ? `?mon=${encodeURIComponent(mon)}` : ""));
    o.innerHTML = '<option value="">Tất cả chương</option>' +
      ds.map(c => `<option value="${thoat(c)}">${thoat(c)}</option>`).join("");
    if (ds.includes(dang)) o.value = dang;
  } catch (e) { thongBao(e.message, "loi"); }
}

// Tải tệp lên có thanh tiến độ. fetch không báo được tiến độ tải lên nên dùng XMLHttpRequest.
function taiLenCoTienDo(url, fd, khiTienDo) {
  return new Promise((giaiQuyet, tuChoi) => {
    const x = new XMLHttpRequest();
    x.open("POST", url);
    const phien = Phien.lay();
    if (phien && phien.token) x.setRequestHeader("Authorization", "Bearer " + phien.token);
    x.upload.onprogress = e => { if (e.lengthComputable) khiTienDo(e.loaded / e.total); };
    x.onload = () => {
      let j = null;
      try { j = JSON.parse(x.responseText); } catch (e) { /* phản hồi không phải JSON */ }
      if (x.status >= 200 && x.status < 300) return giaiQuyet(j);
      if (x.status === 401) { Phien.xoa(); location.href = "/vao"; }
      const loi = new Error((j && typeof j.detail === "string" && j.detail) || `Máy chủ trả về lỗi ${x.status}`);
      loi.status = x.status;
      tuChoi(loi);
    };
    x.onerror = () => tuChoi(new Error("Mất kết nối khi tải tệp lên. Thầy cô thử lại."));
    x.send(fd);
  });
}

async function napTep() {
  const tep = document.getElementById("tep").files[0];
  const o = document.getElementById("ket-qua-nap");
  if (!tep) { o.innerHTML = '<div class="canh-bao-o">Thầy cô chọn file trước đã.</div>'; return; }

  const nut = document.getElementById("nut-nap-tep");
  const khung = document.getElementById("tien-do-nap");
  const thanh = document.getElementById("tien-do-nap-i");
  const chu = document.getElementById("tien-do-nap-chu");
  nut.disabled = true; nut.textContent = "Đang xử lý...";
  o.innerHTML = "";
  khung.classList.remove("an");
  thanh.style.width = "0%"; chu.textContent = "Đang tải lên 0%";
  const fd = new FormData();
  fd.append("mon", document.getElementById("mon-nap").value);
  fd.append("tep", tep);
  try {
    const kq = await taiLenCoTienDo("/api/admin/hoc-lieu/nap", fd, tyLe => {
      thanh.style.width = Math.round(tyLe * 100) + "%";
      chu.textContent = tyLe < 1 ? `Đang tải lên ${Math.round(tyLe * 100)}%`
                                 : "Đã tải lên 100%. Đang tách đoạn và gán nhãn...";
    });
    thanh.style.width = "100%";
    chu.textContent = "Hoàn tất.";
    o.innerHTML = `<div class="canh-bao-o luc">Đã nạp <b>${kq.so_doan}</b> đoạn
       từ file ${thoat(kq.tep)} vào môn ${thoat(kq.mon)}.</div>`;
    thongBao(`Nạp xong ${kq.so_doan} đoạn`, "xong");
    document.getElementById("tep").value = "";
    await napChuong();
    napDanhSachDoan(1);
  } catch (e) {
    khung.classList.add("an");
    o.innerHTML = `<div class="canh-bao-o">${thoat(e.message)}</div>`;
  } finally {
    nut.disabled = false; nut.textContent = "Nạp vào kho";
  }
}

function boLocDangDung() {
  return document.getElementById("tim-doan").value.trim() || document.getElementById("loc-mon").value
    || document.getElementById("loc-chuong").value;
}

function veThanhChon() {
  const o = document.getElementById("thanh-chon");
  const n = daChon.size;
  o.classList.toggle("an", n === 0);
  if (n === 0) { o.innerHTML = ""; }
  else {
    const qua = n > TOI_DA_MOT_LAN;
    o.innerHTML = `<b>Đã chọn ${n} đoạn</b>
      <button class="phu nho" id="sua-hang-loat" ${qua ? "disabled" : ""}>Sửa nhãn</button>
      <button class="nguy nho" id="xoa-hang-loat" ${qua ? "disabled" : ""}>Xóa</button>
      <button class="nhe nho" id="bo-chon">Bỏ chọn</button>
      ${qua ? `<span class="mo-nho" style="color:var(--do-sau)">Chỉ thao tác tối đa ${TOI_DA_MOT_LAN} đoạn một lần. Bỏ bớt đoạn đã chọn.</span>` : ""}`;
    document.getElementById("bo-chon").onclick = () => {      // phản hồi ngay, không đợi tải lại bảng
      daChon.clear();
      document.querySelectorAll(".chon-doan").forEach(c => { c.checked = false; });
      veThanhChon();
    };
    document.getElementById("xoa-hang-loat").onclick = xoaHangLoat;
    document.getElementById("sua-hang-loat").onclick = suaHangLoat;
  }
  const tatCa = document.getElementById("chon-tat-ca");
  if (tatCa) {
    const so = doanTrenTrang.filter(d => daChon.has(d.id)).length;
    tatCa.checked = doanTrenTrang.length > 0 && so === doanTrenTrang.length;
    tatCa.indeterminate = so > 0 && so < doanTrenTrang.length;
  }
}

async function xoaHangLoat() {
  const n = daChon.size;
  if (!await xacNhan(`Xóa ${n} đoạn học liệu đã chọn? Việc này không hoàn tác được, ` +
      "và trợ giảng sẽ không còn dựa vào những đoạn này để trả lời.", `Xóa ${n} đoạn`)) return;
  try {
    const kq = await API.post("/api/admin/hoc-lieu/xoa-nhieu", { ids: [...daChon] });
    daChon.clear();
    thongBao(`Đã xóa ${kq.so_doan_da_xoa} đoạn`, "xong");
    await napChuong();
    napDanhSachDoan(trangDoan);
  } catch (e) { thongBao(e.message, "loi"); }
}

function suaHangLoat() {
  const phu = tao("div", "lop-phu");
  const the = tao("div", "the");
  the.innerHTML = `
    <h2>Sửa nhãn ${daChon.size} đoạn đã chọn</h2>
    <p class="mo">Chỉ ô nào thầy cô điền mới được đổi; ô để trống thì giữ nguyên nhãn cũ.</p>
    <div class="o"><label for="h-chuong">Chương</label>
      <input id="h-chuong" maxlength="200" placeholder="Giữ nguyên"></div>
    <div class="o cach-nho"><label for="h-bai">Bài</label>
      <input id="h-bai" maxlength="200" placeholder="Giữ nguyên"></div>
    <div class="o cach-nho"><label for="h-dang">Dạng bài</label>
      <input id="h-dang" maxlength="200" placeholder="Giữ nguyên"></div>
    <p id="h-loi" class="mo" style="color:var(--do-sau);margin:8px 0 0"></p>
    <div class="hang cach" style="justify-content:flex-end">
      <button class="phu" id="h-huy">Hủy</button><button id="h-luu">Áp dụng</button></div>`;
  phu.appendChild(the);
  phu.onclick = e => { if (e.target === phu) phu.remove(); };
  document.body.appendChild(phu);
  the.querySelector("#h-chuong").focus();
  the.querySelector("#h-huy").onclick = () => phu.remove();
  the.querySelector("#h-luu").onclick = async () => {
    const than = { ids: [...daChon] };
    for (const [truong, id] of [["chuong", "h-chuong"], ["bai", "h-bai"], ["dang_bai", "h-dang"]]) {
      const v = the.querySelector("#" + id).value.trim();
      if (v) than[truong] = v;
    }
    if (Object.keys(than).length === 1) { the.querySelector("#h-loi").textContent = "Điền ít nhất một nhãn cần đổi."; return; }
    try {
      const kq = await API.post("/api/admin/hoc-lieu/sua-nhieu", than);
      phu.remove();
      thongBao(`Đã sửa nhãn ${kq.so_doan_da_sua} đoạn`, "xong");
      await napChuong();
      napDanhSachDoan(trangDoan);
    } catch (e) { the.querySelector("#h-loi").textContent = e.message; }
  };
}

async function xemTruoc(id) {
  try {
    const d = await API.get(`/api/admin/hoc-lieu/${id}`);
    hopThoai("Xem trước đoạn học liệu",
      `<p class="mo-nho">${[d.mon, d.chuong, d.bai, d.dang_bai].filter(Boolean).map(thoat).join(" · ")}</p>
       <pre class="xem-truoc" tabindex="0">${thoat(d.noi_dung)}</pre>
       <p class="mo-nho">Nguồn: ${thoat(d.nguon || "không rõ")}</p>`);
  } catch (e) { thongBao(e.message, "loi"); }
}

async function napDanhSachDoan(trang) {
  trangDoan = trang;
  const o = document.getElementById("bang-doan");
  o.innerHTML = khungXuong(3);
  const mon = document.getElementById("loc-mon").value;
  const chuong = document.getElementById("loc-chuong").value;
  const tim = document.getElementById("tim-doan").value.trim();
  const truyVan = new URLSearchParams({ trang, moi_trang: 15 });
  if (mon) truyVan.set("mon", mon);
  if (chuong) truyVan.set("chuong", chuong);
  if (tim) truyVan.set("tim", tim);
  let kq;
  try { kq = await API.get(`/api/admin/hoc-lieu?${truyVan}`); }
  catch (e) { o.innerHTML = `<div class="canh-bao-o">${thoat(e.message)}</div>`; return; }
  doanTrenTrang = kq.danh_sach;
  document.getElementById("tong-doan").textContent = boLocDangDung()
    ? `${kq.tong} đoạn khớp bộ lọc` : `Tổng ${kq.tong} đoạn`;

  if (!kq.tong) {
    o.innerHTML = boLocDangDung()
      ? trongRong("sach", "Không có đoạn nào khớp", "Thử từ khóa khác hoặc bấm “Xóa bộ lọc”.")
      : trongRong("sach", "Kho đang trống", "Nạp đề cương ở phần trên.");
    document.getElementById("phan-trang").innerHTML = "";
    veThanhChon();
    return;
  }

  o.innerHTML = `<div class="cuon-ngang"><table>
    <thead><tr><th class="hep"><input type="checkbox" id="chon-tat-ca" aria-label="Chọn cả trang này"></th>
      <th>Môn</th><th>Chương</th><th>Bài</th><th>Dạng bài</th>
      <th>Trích</th><th></th></tr></thead>
    <tbody>${kq.danh_sach.map(d => `<tr data-id="${d.id}">
      <td class="hep"><input type="checkbox" class="chon-doan" data-id="${d.id}"
            aria-label="Chọn đoạn ${d.id}" ${daChon.has(d.id) ? "checked" : ""}></td>
      <td>${thoat(d.mon)}</td>
      <td>${thoat(d.chuong)}</td>
      <td>${thoat(d.bai)}</td>
      <td>${d.dang_bai ? thoat(d.dang_bai) : '<span class="mo-nho">chưa có</span>'}</td>
      <td><div class="mo-nho cat-dong">${thoat(d.trich)}...</div></td>
      <td class="phai hep">
        <button class="nhe nho" data-xem="${d.id}">Xem</button>
        <button class="phu nho" data-sua="${d.id}">Sửa</button>
        <button class="nhe nho" data-xoa="${d.id}">Xóa</button></td>
    </tr>`).join("")}</tbody></table></div>`;

  o.querySelectorAll(".chon-doan").forEach(c => {
    c.onchange = () => {
      const id = Number(c.dataset.id);
      if (c.checked) daChon.add(id); else daChon.delete(id);
      veThanhChon();
    };
  });
  document.getElementById("chon-tat-ca").onchange = e => {
    doanTrenTrang.forEach(d => { if (e.target.checked) daChon.add(d.id); else daChon.delete(d.id); });
    o.querySelectorAll(".chon-doan").forEach(c => { c.checked = e.target.checked; });
    veThanhChon();
  };
  o.querySelectorAll("button[data-xem]").forEach(b => { b.onclick = () => xemTruoc(b.dataset.xem); });
  o.querySelectorAll("button[data-sua]").forEach(b => {
    b.onclick = () => suaNhan(kq.danh_sach.find(x => x.id == b.dataset.sua));
  });
  o.querySelectorAll("button[data-xoa]").forEach(b => {
    b.onclick = async () => {
      if (!await xacNhan("Xóa đoạn học liệu này? Việc này không hoàn tác được.", "Xóa")) return;
      await API.xoa(`/api/admin/hoc-lieu/${b.dataset.xoa}`);
      daChon.delete(Number(b.dataset.xoa));
      thongBao("Đã xóa đoạn", "xong");
      await napChuong();
      napDanhSachDoan(trang);
    };
  });
  veThanhChon();

  const soTrang = Math.ceil(kq.tong / kq.moi_trang);
  document.getElementById("phan-trang").innerHTML = soTrang > 1
    ? `<div class="hang" style="justify-content:center">
        <button class="phu nho" ${trang <= 1 ? "disabled" : ""} id="truoc">Trang trước</button>
        <span class="mo-nho">Trang ${trang} trên ${soTrang} &middot; ${kq.tong} đoạn</span>
        <button class="phu nho" ${trang >= soTrang ? "disabled" : ""} id="sau">Trang sau</button>
       </div>`
    : "";
  document.getElementById("truoc")?.addEventListener("click", () => napDanhSachDoan(trang - 1));
  document.getElementById("sau")?.addEventListener("click", () => napDanhSachDoan(trang + 1));
}

// Tự dựng lớp phủ thay vì dùng hopThoai, vì ta cần đọc giá trị các ô nhập
// ngay trước lúc gỡ hộp thoại khỏi trang.
function suaNhan(d) {
  const phu = tao("div", "lop-phu");
  const the = tao("div", "the");
  the.innerHTML = `
    <h2>Sửa nhãn đoạn học liệu</h2>
    <p class="mo">Nhãn này quyết định câu hỏi của học sinh được xếp vào đâu
       trong bảng thống kê, nên sửa đúng rất quan trọng.</p>
    <div class="o"><label>Chương</label>
      <input id="s-chuong" aria-label="Chương" value="${thoat(d.chuong)}"></div>
    <div class="o cach-nho"><label>Bài</label>
      <input id="s-bai" aria-label="Bài" value="${thoat(d.bai)}"></div>
    <div class="o cach-nho"><label>Dạng bài</label>
      <input id="s-dang" aria-label="Dạng bài" value="${thoat(d.dang_bai || "")}"
        placeholder="Ví dụ: Phương trình bậc hai có tham số"></div>
    <div class="the gon phang cach-nho" style="margin:0">
      <div class="mo-nho">${thoat(d.trich)}...</div></div>
    <div class="hang cach" style="justify-content:flex-end">
      <button class="phu" id="s-huy">Hủy</button>
      <button id="s-luu">Lưu thay đổi</button>
    </div>`;
  phu.appendChild(the);
  phu.onclick = e => { if (e.target === phu) phu.remove(); };
  document.body.appendChild(phu);
  the.querySelector("#s-chuong").focus();

  the.querySelector("#s-huy").onclick = () => phu.remove();
  the.querySelector("#s-luu").onclick = async () => {
    const than = {
      chuong: the.querySelector("#s-chuong").value.trim(),
      bai: the.querySelector("#s-bai").value.trim(),
      dang_bai: the.querySelector("#s-dang").value.trim(),
    };
    try {
      await API.put(`/api/admin/hoc-lieu/${d.id}`, than);
      phu.remove();
      thongBao("Đã cập nhật nhãn", "xong");
      await napChuong();
      napDanhSachDoan(trangDoan);
    } catch (e) {
      thongBao(e.message, "loi");
    }
  };
}

// ======================================================== tổng quan

let dsHocSinh = [];

async function veHocSinh() {
  oNoiDung.innerHTML = `
    <div class="the">
      <h2>Nhập danh sách học sinh</h2>

        <div class="o"><label for="loc-lop-hs">Lớp</label>
          <select id="loc-lop-hs"><option value="">Tất cả lớp</option></select></div>
        <span class="mo-nho" id="tong-hs"></span>
      </div>
      <div id="bang-hs"></div>
    </div>`;
  document.getElementById("tai-mau").onclick = e => {

    const blob = new Blob(["\ufeffma,ho_ten,lop\nHS001,Nguyễn Văn An,9A\nHS002,Trần Thị Bình,9A\n"], { type: "text/csv;charset=utf-8" });
    const a = tao("a"); a.href = URL.createObjectURL(blob); a.download = "mau-danh-sach-hoc-sinh.csv"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);

  document.getElementById("kiem-tra-tep").onclick = () => nhapTep(false);

async function napHocSinh() {
  dsHocSinh = await API.get("/api/admin/hoc-sinh");
  const lop = document.getElementById("loc-lop-hs");
  const dang = lop.value;
  const cacLop = [...new Set(dsHocSinh.map(h => h.lop).filter(Boolean))].sort();
  lop.innerHTML = '<option value="">Tất cả lớp</option>' + cacLop.map(l => `<option value="${thoat(l)}">${thoat(l)}</option>`).join("");
  if (cacLop.includes(dang)) lop.value = dang;
  veBangHocSinh();
}

function veBangHocSinh() {
  const tim = document.getElementById("tim-hs").value.trim().toLocaleLowerCase("vi");
  const lop = document.getElementById("loc-lop-hs").value;
  const ds = dsHocSinh.filter(h => (!lop || h.lop === lop) && (!tim || `${h.ma} ${h.ho_ten}`.toLocaleLowerCase("vi").includes(tim)));
  document.getElementById("tong-hs").textContent = `${ds.length}/${dsHocSinh.length} học sinh`;
  const o = document.getElementById("bang-hs");
  if (!ds.length) {
    o.innerHTML = trongRong("nguoi", dsHocSinh.length ? "Không có học sinh nào khớp" : "Chưa có học sinh nào",
      dsHocSinh.length ? "Thử từ khóa khác hoặc chọn lớp khác." : "Thêm từng em hoặc nhập danh sách từ tệp ở phần trên.");
    return;
  }
  o.innerHTML = `<div class="cuon-ngang"><table>
    <thead><tr><th>Mã</th><th>Họ tên</th><th>Lớp</th><th>Số ca</th><th></th></tr></thead>
    <tbody>${ds.map(h => `<tr>
      <td><b>${thoat(h.ma)}</b></td><td>${thoat(h.ho_ten)}</td><td>${thoat(h.lop || "")}</td>
      <td>${h.so_ca}</td>
      <td class="phai hep">
        <button class="phu nho" data-sua-hs="${thoat(h.ma)}">Sửa</button>
        <button class="nhe nho" data-xoa-hs="${thoat(h.ma)}" ${h.co_du_lieu
          ? 'disabled title="Học sinh đã có bài làm hoặc dữ liệu nên không xóa được"' : ""}>Xóa</button></td></tr>`).join("")}</tbody></table></div>`;
  o.querySelectorAll("button[data-sua-hs]").forEach(b => {
    b.onclick = () => hopHocSinh(dsHocSinh.find(h => h.ma === b.dataset.suaHs));
  });
  o.querySelectorAll("button[data-xoa-hs]").forEach(b => {
    b.onclick = async () => {
      const h = dsHocSinh.find(x => x.ma === b.dataset.xoaHs);
      if (!await xacNhan(`Xóa học sinh ${h.ma} (${h.ho_ten})? Việc này không hoàn tác được.`, "Xóa")) return;
      try {
        await API.xoa(`/api/admin/hoc-sinh/${encodeURIComponent(h.ma)}`);
        thongBao("Đã xóa học sinh", "xong");
        await napHocSinh();
      } catch (e) { thongBao(e.message, "loi"); }
    };
  });
}

function hopHocSinh(h) {
  const sua = Boolean(h);
  const phu = tao("div", "lop-phu"), the = tao("div", "the");
  the.setAttribute("role", "dialog"); the.setAttribute("aria-modal", "true");
  the.innerHTML = `<h2>${sua ? "Sửa học sinh" : "Thêm học sinh"}</h2>
    <div class="o"><label for="f-ma">Mã đăng nhập</label>
      <input id="f-ma" maxlength="20" value="${thoat(h?.ma || "")}" ${sua ? "readonly" : ""}
             placeholder="Chữ, số, gạch nối; 2 đến 20 ký tự"></div>
    <div class="o cach-nho"><label for="f-ten">Họ tên</label>
      <input id="f-ten" maxlength="100" value="${thoat(h?.ho_ten || "")}"></div>
    <div class="o cach-nho"><label for="f-lop">Lớp (không bắt buộc)</label>
      <input id="f-lop" maxlength="20" value="${thoat(h?.lop || "")}" placeholder="Ví dụ: 9A"></div>
    <p id="f-loi" class="mo" style="color:var(--do-sau);margin:8px 0 0"></p>
    <div class="hang cach" style="justify-content:flex-end">
      <button class="phu" id="f-huy">Hủy</button><button id="f-luu">${sua ? "Lưu" : "Thêm"}</button></div>`;
  phu.appendChild(the);
  phu.onclick = e => { if (e.target === phu) phu.remove(); };
  document.body.appendChild(phu);
  the.querySelector(sua ? "#f-ten" : "#f-ma").focus();
  the.querySelector("#f-huy").onclick = () => phu.remove();
  the.querySelector("#f-luu").onclick = async () => {
    const than = { ho_ten: the.querySelector("#f-ten").value.trim(), lop: the.querySelector("#f-lop").value.trim() || null };
    if (!than.ho_ten) { the.querySelector("#f-loi").textContent = "Cần nhập họ tên."; return; }
    try {
      if (sua) await API.put(`/api/admin/hoc-sinh/${encodeURIComponent(h.ma)}`, than);
      else await API.post("/api/admin/hoc-sinh", { ma: the.querySelector("#f-ma").value.trim(), ...than });
      phu.remove();
      thongBao(sua ? "Đã lưu" : "Đã thêm học sinh", "xong");
      await napHocSinh();
    } catch (e) { the.querySelector("#f-loi").textContent = e.message; }
  };
}

async function nhapTep(ghi) {
  const tep = document.getElementById("tep-hs").files[0];
  const o = document.getElementById("bao-cao-nhap");
  if (!tep) { o.innerHTML = '<div class="canh-bao-o">Thầy cô chọn tệp trước đã.</div>'; return; }
  const fd = new FormData();
  fd.append("tep", tep); fd.append("ghi", ghi ? "1" : "0");
  o.innerHTML = khungXuong(2);
  try {
    const kq = await API.post("/api/admin/hoc-sinh/nhap", fd);
    if (ghi) {
      o.innerHTML = `<div class="canh-bao-o luc">Đã thêm <b>${kq.da_them}</b> học sinh.
        ${kq.loi.length ? `${kq.loi.length} dòng lỗi được bỏ qua (liệt kê bên dưới).` : ""}</div>` + veLoiNhap(kq);
      thongBao(`Đã thêm ${kq.da_them} học sinh`, "xong");
      document.getElementById("tep-hs").value = "";
      await napHocSinh();
      return;
    }
    o.innerHTML = `<div class="canh-bao-o ${kq.loi.length ? "" : "luc"}">Đọc được <b>${kq.tong}</b> dòng:
        <b>${kq.hop_le}</b> hợp lệ, <b>${kq.loi.length}</b> lỗi. Chưa có gì được ghi vào hệ thống.</div>` + veLoiNhap(kq) +
      `<div class="hang cach"><button id="nhap-hop-le" ${kq.hop_le ? "" : "disabled"}>Nhập ${kq.hop_le} dòng hợp lệ</button>
         ${kq.loi.length ? '<span class="mo-nho">Các dòng lỗi sẽ được bỏ qua. Thầy cô có thể sửa tệp rồi kiểm tra lại.</span>' : ""}</div>`;
    document.getElementById("nhap-hop-le").onclick = () => nhapTep(true);
  } catch (e) { o.innerHTML = `<div class="canh-bao-o">${thoat(e.message)}</div>`; }
}

function veLoiNhap(kq) {
  if (!kq.loi.length) return "";
  return `<div class="cuon-ngang cach-nho"><table id="bang-loi-nhap"><thead><tr><th>Dòng</th><th>Mã</th><th>Lý do</th></tr></thead>
    <tbody>${kq.loi.map(l => `<tr><td>${l.dong}</td><td>${thoat(l.ma)}</td><td>${thoat(l.ly_do)}</td></tr>`).join("")}</tbody></table></div>`;
}

async function napNhatKy(trang) {
  const o = document.getElementById("bang-nhat-ky");
  o.innerHTML = khungXuong(3);
  const q = new URLSearchParams({ trang, moi_trang: 20 });
  const ca = document.getElementById("nk-ca").value, hd = document.getElementById("nk-hanh-dong").value;
  if (ca) q.set("ca", ca);
  if (hd) q.set("hanh_dong", hd);
  if (document.getElementById("nk-an-dang-nhap").checked) q.set("an_dang_nhap", "true");
  let kq;
  try { kq = await API.get(`/api/audit?${q}`); }
  catch (e) { o.innerHTML = `<div class="canh-bao-o">${thoat(e.message)}</div>`; return; }
  if (!kq.tong) {
    o.innerHTML = trongRong("sach", "Chưa có mục nào", "Thử bỏ bớt bộ lọc.");
    document.getElementById("phan-trang-nk").innerHTML = "";
    return;
  }
  const chiTiet = e => {
    const mau = [e.du_lieu_truoc && `Trước: ${e.du_lieu_truoc}`, e.du_lieu_sau && `Sau: ${e.du_lieu_sau}`].filter(Boolean);
    return mau.length ? `<details><summary class="mo-nho">Xem</summary><div class="mo-nho" style="word-break:break-word">${mau.map(thoat).join("<br>")}</div></details>` : "";
  };
  o.innerHTML = `<div class="cuon-ngang"><table>
    <thead><tr><th>Lúc</th><th>Người thực hiện</th><th>Hành động</th><th>Đối tượng</th><th>Chi tiết</th></tr></thead>
    <tbody>${kq.danh_sach.map(e => `<tr>
      <td class="mo-nho">${dinhDangNgay(e.tao_luc)}</td>
      <td><b>${thoat(e.chu_the)}</b></td>
      <td>${thoat(TEN_HANH_DONG[e.hanh_dong] || e.hanh_dong)}</td>
      <td class="mo-nho">${thoat(e.loai_doi_tuong || "")} ${thoat(e.ma_doi_tuong || "")}${e.ca_thi ? ` · ca ${e.ca_thi}` : ""}</td>
      <td>${chiTiet(e)}</td></tr>`).join("")}</tbody></table></div>`;
  const soTrang = Math.ceil(kq.tong / kq.moi_trang);
  document.getElementById("phan-trang-nk").innerHTML = soTrang > 1
    ? `<div class="hang" style="justify-content:center">
        <button class="phu nho" id="nk-truoc" ${trang <= 1 ? "disabled" : ""}>Trang trước</button>
        <span class="mo-nho">Trang ${trang} trên ${soTrang} · ${kq.tong} mục</span>
        <button class="phu nho" id="nk-sau" ${trang >= soTrang ? "disabled" : ""}>Trang sau</button></div>`
    : `<span class="mo-nho">${kq.tong} mục</span>`;
  document.getElementById("nk-truoc")?.addEventListener("click", () => napNhatKy(trang - 1));
  document.getElementById("nk-sau")?.addEventListener("click", () => napNhatKy(trang + 1));
}

      ${ds.length ? `<div class="cuon-ngang"><table>
        <thead><tr><th>Mã</th><th>Tên đề</th><th>Môn</th>

        : trongRong("bai", "Chưa có đề nào", "Soạn đề đầu tiên ở phần trên.")}
    </div>`;
  document.getElementById("nut-tao-de").onclick = taoDe;
}

async function taoDe() {
  const o = document.getElementById("kq-de");
  const ten = document.getElementById("ten-de").value.trim();
  const dong = document.getElementById("cau").value.trim().split("\n").filter(x => x.trim());
  if (!ten || !dong.length) {
    o.innerHTML = '<div class="canh-bao-o">Cần có tên đề và ít nhất một câu hỏi.</div>';
    return;
  }

  const cau_hoi = [], loi = [];
  dong.forEach((d, i) => {
    const p = d.split("|").map(x => x.trim());
    if (p.length < 4) { loi.push(`Dòng ${i + 1}: cần ít nhất nội dung và ba phương án`); return; }
    const dap_an = parseInt(p[p.length - 1], 10);
    const phuong_an = p.slice(1, -1);
    if (!dap_an || dap_an < 1 || dap_an > phuong_an.length) {
      loi.push(`Dòng ${i + 1}: số thứ tự đáp án phải từ 1 đến ${phuong_an.length}`);
      return;
    }
    cau_hoi.push({ noi_dung: p[0], phuong_an, dap_an: dap_an - 1, muc_do: "vua" });
  });

  if (loi.length) {
    o.innerHTML = `<div class="canh-bao-o">${loi.map(thoat).join("<br>")}</div>`;
    return;
  }
  try {
    const kq = await API.post("/api/exam/de", {
      ten, mon: document.getElementById("mon-de").value,
      so_phut: Number(document.getElementById("phut").value), cau_hoi });
    thongBao(`Đã tạo đề ${kq.de_thi} với ${kq.so_cau} câu`, "xong");
    veMuc();
  } catch (e) {
    o.innerHTML = `<div class="canh-bao-o">${thoat(e.message)}</div>`;
  }
}

// Ô CSV bắt đầu bằng = + - @ bị Excel hiểu là công thức, nên thêm dấu nháy trước.
function oCsv(gt) {
  const s = String(gt ?? "");
  return '"' + (/^[=+\-@\t\r]/.test(s) ? "'" + s : s).replace(/"/g, '""') + '"';
}

function taiCsvMa(tenCa, ma) {
  const dong = ["hoc_sinh,ho_ten,lop,ma_du_thi",
    ...ma.map(x => [x.hoc_sinh, x.ho_ten, x.lop, x.ma_du_thi].map(oCsv).join(","))];
  const blob = new Blob(["﻿" + dong.join("\r\n") + "\r\n"], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `ma-du-thi-${tenCa.replace(/[^\p{L}\p{N}]+/gu, "-")}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// F3: học sinh quên mã thì cấp mã mới cho riêng em đó.
async function capLaiMa(caId, tenCa) {
  try {
    const [nguoiDung, phanCong] = await Promise.all([
      API.get("/api/exam/nguoi-dung"), API.get(`/api/exam/ca/${caId}/phan-cong`)]);
    const trongCa = new Set(phanCong.filter(x => x.vai_tro_trong_ca === "hoc_sinh").map(x => x.nguoi_dung));
    const dsHs = nguoiDung.filter(x => trongCa.has(x.ma));
    if (!dsHs.length) { thongBao("Ca này chưa có học sinh nào", "loi"); return; }
    const phu = tao("div", "lop-phu"), the = tao("div", "the");
    the.setAttribute("role", "dialog"); the.setAttribute("aria-modal", "true");
    the.innerHTML = `<h2>Cấp lại mã: ${thoat(tenCa)}</h2>
      <p class="mo">Chọn học sinh quên mã. Mã cũ của em đó hết hiệu lực, mã của các em khác giữ nguyên.</p>
      <div class="o"><label for="cl-hs">Học sinh</label><select id="cl-hs">${dsHs.map(x =>
        `<option value="${thoat(x.ma)}">${thoat(x.ma)} · ${thoat(x.ho_ten)}${x.lop ? ` · ${thoat(x.lop)}` : ""}</option>`).join("")}</select></div>
      <div id="cl-kq" class="cach-nho"></div>
      <div class="hang cach" style="justify-content:flex-end">
        <button class="phu" id="cl-dong">Đóng</button><button id="cl-cap">Cấp mã mới</button></div>`;
    phu.appendChild(the); document.body.appendChild(phu);
    the.querySelector("#cl-dong").onclick = () => phu.remove();
    the.querySelector("#cl-cap").onclick = async () => {
      const hs = the.querySelector("#cl-hs").value, kq = the.querySelector("#cl-kq");
      try {
        const r = await API.post(`/api/exam/ca/${caId}/ma-du-thi/${encodeURIComponent(hs)}`, {});
        kq.innerHTML = `<p class="canh-bao-o">Mã chỉ hiện lúc này. Hãy gửi cho em ${thoat(hs)} trước khi đóng.</p>
          <p>Mã mới của <b>${thoat(hs)}</b>: <code class="ma-du-thi-hien">${thoat(r.ma_du_thi)}</code>
          <button class="phu nho" id="cl-chep">Sao chép</button></p>`;
        kq.querySelector("#cl-chep").onclick = async () => {
          try { await navigator.clipboard.writeText(r.ma_du_thi); thongBao("Đã sao chép mã", "xong"); }
          catch (_) { thongBao("Trình duyệt không cho sao chép tự động. Hãy chọn mã và sao chép thủ công.", "loi"); }
        };
      } catch (e) { kq.innerHTML = `<div class="canh-bao-o">${thoat(e.message)}</div>`; }
    };
  } catch (e) { thongBao(e.message, "loi"); }
}

    "Tạo bộ mã mới sẽ làm các mã cũ của ca này mất hiệu lực. Sau khi tạo, hãy sao chép và gửi riêng cho từng học sinh.",
    "Tạo mã mới");
  if (!dongY) return;
  try {
    const kq = await API.post(`/api/exam/ca/${caId}/ma-du-thi`, {});
    const phu = tao("div", "lop-phu"), the = tao("div", "the");
    the.setAttribute("role", "dialog"); the.setAttribute("aria-modal", "true");
    the.innerHTML = `<h2>Mã dự thi: ${thoat(tenCa)}</h2>
      <p class="canh-bao-o">Mã chỉ xuất hiện một lần. Thầy cô hãy sao chép và gửi
      riêng cho từng học sinh trước khi đóng cửa sổ này.</p>
      <p class="mo">Mỗi mã chỉ dùng cho đúng học sinh và ca này. Máy chủ chỉ lưu bản băm và không thể hiện lại các mã này.</p>
      <div class="cuon-ngang"><table><thead><tr><th>Học sinh</th><th>Lớp</th><th>Mã dự thi</th><th></th></tr></thead>
      <tbody>${kq.ma.map(x => `<tr><td><b>${thoat(x.hoc_sinh)}</b><div class="mo-nho">${thoat(x.ho_ten || "")}</div></td>
        <td>${thoat(x.lop || "")}</td>
        <td><code class="ma-du-thi-hien">${thoat(x.ma_du_thi)}</code></td>
        <td class="phai"><button class="phu nho" data-sao-chep="${thoat(x.ma_du_thi)}">Sao chép mã</button></td></tr>`).join("")}</tbody></table></div>
      <div class="hang cach" style="justify-content:flex-end">
        <button class="phu" id="ma-tai-csv">Tải CSV</button>
        <button class="phu" id="ma-in">In danh sách</button>
        <button class="phu" id="ma-sao-chep-tat-ca">Sao chép tất cả</button>
        <button id="ma-dong">Đã lưu xong</button></div>`;
    phu.appendChild(the); document.body.appendChild(phu);
    the.querySelector("#ma-tai-csv").onclick = () => taiCsvMa(tenCa, kq.ma);
    the.querySelector("#ma-in").onclick = () => {
      document.body.classList.add("dang-in-ma");
      window.addEventListener("afterprint", () => document.body.classList.remove("dang-in-ma"), { once: true });
      window.print();
    };
    const saoChep = async (noiDung, thongBaoXong) => {
      try {
        await navigator.clipboard.writeText(noiDung);
        thongBao(thongBaoXong, "xong");
      } catch (_) {
        thongBao("Trình duyệt không cho sao chép tự động. Thầy cô hãy chọn mã và sao chép thủ công.", "loi");
      }
    };
    the.querySelectorAll("button[data-sao-chep]").forEach(b => {
      b.onclick = () => saoChep(b.dataset.saoChep, `Đã sao chép mã ${b.dataset.saoChep}`);
    });
    the.querySelector("#ma-sao-chep-tat-ca").onclick = () => saoChep(
      kq.ma.map(x => `${x.hoc_sinh}: ${x.ma_du_thi}`).join("\n"),
      `Đã sao chép ${kq.ma.length} mã dự thi`);
    the.querySelector("#ma-dong").onclick = () => phu.remove();
  } catch (e) { thongBao(e.message, "loi"); }
}

async function phanCongCa(caId, tenCa) {
  try {
    const [nguoiDung, hienTai] = await Promise.all([
      API.get("/api/exam/nguoi-dung"), API.get(`/api/exam/ca/${caId}/phan-cong`)]);
    const daChon = new Set(hienTai.map(x => x.nguoi_dung));
    const phu = tao("div", "lop-phu"), the = tao("div", "the");
    const nhom = (vaiTro, ten) => `<h3>${ten}</h3><div class="luoi luoi-2">${nguoiDung
      .filter(x => x.vai_tro === vaiTro).map(x => `<label style="display:flex;gap:8px;align-items:center">
        <input style="width:auto" type="checkbox" data-vai-tro="${vaiTro}" value="${thoat(x.ma)}"
          ${daChon.has(x.ma) ? "checked" : ""}> ${thoat(x.ma)} · ${thoat(x.ho_ten)}${x.lop ? ` · ${thoat(x.lop)}` : ""}
      </label>`).join("")}</div>`;
    the.setAttribute("role", "dialog"); the.setAttribute("aria-modal", "true");
    the.innerHTML = `<h2>Phân công: ${thoat(tenCa)}</h2><p class="mo">Chọn mã tham gia ca. Tài khoản giáo viên đang thao tác luôn được giữ lại.</p>
      ${nhom("giao_vien", "Giáo viên")}${nhom("hoc_sinh", "Học sinh")}
      <div class="hang cach" style="justify-content:flex-end"><button class="phu" id="pc-huy">Hủy</button><button id="pc-luu">Lưu phân công</button></div>`;
    phu.appendChild(the); document.body.appendChild(phu);
    the.querySelector("#pc-huy").onclick = () => phu.remove();
    the.querySelector("#pc-luu").onclick = async () => {
      const lay = vaiTro => [...the.querySelectorAll(`input[data-vai-tro="${vaiTro}"]:checked`)].map(x => x.value);
      await API.post(`/api/exam/ca/${caId}/phan-cong`, { giao_vien: lay("giao_vien"), hoc_sinh: lay("hoc_sinh") });
      phu.remove(); thongBao("Đã lưu phân công", "xong");
    };
  } catch (e) { thongBao(e.message, "loi"); }
}

function suaCa(ca) {
  const phu = tao("div", "lop-phu"), the = tao("div", "the");
  the.setAttribute("role", "dialog"); the.setAttribute("aria-modal", "true");
  const o = (id, nhan, gt, loai = "text") =>
    `<div class="o"><label for="${id}">${nhan}</label><input id="${id}" type="${loai}" value="${thoat(gt ?? "")}"></div>`;
  the.innerHTML = `<h2>Sửa ca nháp</h2>
    <p class="mo">Chỉ sửa được khi ca còn là bản nháp và chưa có bài làm.</p>
    <div class="hang">
      ${o("sc-ten", "Tên ca", ca.ten)}${o("sc-lop", "Lớp/phòng", ca.lop)}
      <div class="o" style="flex-basis:100%"><label for="sc-quy-dinh">Quy định công bố trước thi</label>
        <textarea id="sc-quy-dinh" rows="3">${thoat(ca.quy_dinh || "")}</textarea></div>
      ${o("sc-phan-hoi", "Phút phản hồi", ca.phut_phan_hoi || 60, "number")}
      ${o("sc-xu-ly", "Phút xử lý giáo viên", ca.phut_xu_ly_gv || 1440, "number")}
      ${o("sc-luu-anh", "Số ngày lưu ảnh", ca.so_ngay_luu_anh || 30, "number")}
      ${o("sc-ma-cap", "Mã nghiên cứu ghép cặp", ca.ma_nghien_cuu_cap)}
      <div class="o"><label for="sc-giai-doan">Giai đoạn</label><select id="sc-giai-doan">
        <option value="">Không ghép cặp</option>
        <option value="tien_tac_dong" ${ca.giai_doan === "tien_tac_dong" ? "selected" : ""}>Tiền tác động</option>
        <option value="hau_tac_dong" ${ca.giai_doan === "hau_tac_dong" ? "selected" : ""}>Hậu tác động</option></select></div>
      ${o("sc-ma-phong", "Mã phòng nghiên cứu", ca.ma_phong)}
    </div>
    <p id="sc-loi" class="mo" style="color:var(--do);margin:8px 0 0"></p>
    <div class="hang cach" style="justify-content:flex-end">
      <button class="phu" id="sc-huy">Hủy</button><button id="sc-luu">Lưu thay đổi</button></div>`;
  phu.appendChild(the); document.body.appendChild(phu);
  const v = id => the.querySelector("#" + id).value;
  the.querySelector("#sc-huy").onclick = () => phu.remove();
  the.querySelector("#sc-luu").onclick = async () => {
    const loi = the.querySelector("#sc-loi");
    if (!v("sc-ten").trim()) { loi.textContent = "Cần đặt tên cho ca thi."; return; }
    try {
      await API.put(`/api/exam/ca/${ca.id}`, { ten: v("sc-ten").trim(), lop: v("sc-lop") || null,
        muc_giam_sat: ca.muc_giam_sat, quy_dinh: v("sc-quy-dinh"),
        phut_phan_hoi: Number(v("sc-phan-hoi")), phut_xu_ly_gv: Number(v("sc-xu-ly")),
        cho_phep_gia_han: !!ca.cho_phep_gia_han, so_ngay_luu_anh: Number(v("sc-luu-anh")),
        ma_nghien_cuu_cap: v("sc-ma-cap") || null, giai_doan: v("sc-giai-doan") || null,
        ma_phong: v("sc-ma-phong") || null });
      phu.remove(); thongBao("Đã sửa ca nháp", "xong"); veMuc();
    } catch (e) { loi.textContent = e.message; }
  };
}

async function taoCa() {
  const ten = document.getElementById("ten-ca").value.trim();
  const o = document.getElementById("kq-ca");
  if (!ten) { o.innerHTML = '<div class="canh-bao-o">Cần đặt tên cho ca thi.</div>'; return; }
  try {
    const kq = await API.post("/api/exam/ca", {
      de_thi: Number(document.getElementById("de-ca").value),
      ten, lop: [...document.querySelectorAll("#lop-ca input:checked")].map(x => x.value).join(", ") || null,
      muc_giam_sat: document.getElementById("muc-ca").value,
      quy_dinh: document.getElementById("quy-dinh-ca").value,
      phut_phan_hoi: Number(document.getElementById("phut-phan-hoi").value),
      phut_xu_ly_gv: Number(document.getElementById("phut-xu-ly").value),
      so_ngay_luu_anh: Number(document.getElementById("ngay-luu-anh").value),
      ma_nghien_cuu_cap: document.getElementById("ma-cap").value || null,
      giai_doan: document.getElementById("giai-doan").value || null,
      ma_phong: document.getElementById("ma-phong").value || null,
      cho_phep_gia_han: document.getElementById("cho-gia-han").checked });
    thongBao(`Đã tạo ca thi nháp số ${kq.ca_thi} với ${kq.so_hoc_sinh} học sinh`, "xong");
    veMuc();
  } catch (e) {
    o.innerHTML = `<div class="canh-bao-o">${thoat(e.message)}</div>`;
  }
}

async function xemBaoCao(ca_id) {
  const b = await API.get(`/api/admin/bao-cao/ca-thi/${ca_id}`);
  const TEN = { roi_khung_hinh: "Rời khỏi khung hình", nguoi_thu_hai: "Người thứ hai",
                nhin_ra_ngoai: "Nhìn ra ngoài màn hình", chuyen_cua_so: "Chuyển cửa sổ" };
  const oSo = (s, t) => `<div class="o-so"><div class="so">${s ?? "—"}</div>
    <div class="ten">${t}</div></div>`;
  const tongSuKien = b.su_kien_he_thong.reduce((n, x) => n + x.so_luong, 0);
  hopThoai(`Báo cáo: ${b.ca_thi.ten}`, `
    <div class="luoi luoi-3" style="margin-bottom:14px">
      ${oSo(b.so_hoc_sinh, "học sinh dự thi")}
      ${oSo(b.diem_trung_binh, "điểm trung bình")}
      ${oSo(tongSuKien, "sự kiện máy ghi")}
    </div>
    <p class="mo">Điểm cao nhất ${b.diem_cao_nhat ?? "—"},
       thấp nhất ${b.diem_thap_nhat ?? "—"}. Sự kiện máy không phải kết luận.</p>
    <h3>Sự kiện hệ thống</h3><p>${tongSuKien} sự kiện theo cấu hình ngưỡng.</p>
    <h3>Sự cố kỹ thuật</h3><p>${b.su_co_ky_thuat.length} trạng thái kỹ thuật.</p>
    <h3>Hỗ trợ</h3><p>${b.ho_tro.length} yêu cầu hỗ trợ.</p>
    <h3>Phán đoán giáo viên</h3><p>${b.thay_doi_phan_doan.length} bản ghi vòng hai.</p>
    <h3>Kết luận của con người</h3><p>${b.ket_luan_con_nguoi.length} phiên bản quyết định.</p>
    <p class="cach-nho"><button class="nut phu nho" onclick="taiFile('/api/admin/xuat/ca-thi/${ca_id}')">
      Tải dữ liệu thô CSV</button></p>`);
}

// ==================================================== mục 4: dữ liệu nghiên cứu
async function veDuLieu() {
  const ca = await API.get("/api/exam/ca");
  const tn = ca.filter(c => c.nhom === "TN"), dc = ca.filter(c => c.nhom === "DC");
  oNoiDung.innerHTML = `
    <div class="the">
      <h2>So sánh hai nhóm</h2>
      <p class="mo">So số dấu hiệu bất thường giữa nhóm có giám sát và nhóm đối
         chứng, kèm kiểm định t. Đây là bảng đi thẳng vào báo cáo dự án 2.</p>
      <div class="hang">
        <div class="o"><label>Ca nhóm có giám sát</label>
          <select id="ca-tn" aria-label="Ca nhóm có giám sát">${tn.map(c =>
            `<option value="${c.id}">${thoat(c.ten)}</option>`).join("")}</select></div>
        <div class="o"><label>Ca nhóm đối chứng</label>
          <select id="ca-dc" aria-label="Ca nhóm đối chứng">${dc.map(c =>
            `<option value="${c.id}">${thoat(c.ten)}</option>`).join("")}</select></div>
        <button id="nut-so-sanh">So sánh</button>
      </div>
      <div id="kq-so-sanh" class="cach"></div>
    </div>

    <div class="the">
      <h2>Tải dữ liệu</h2>
      <p class="mo">File CSV mở được bằng Excel, dùng làm phụ lục báo cáo.</p>
      <div class="bao">
        <button class="nut phu nho" onclick="taiFile('/api/admin/xuat/cau-hoi')">Nhật ký hỏi bài</button>
        ${ca.map(c => `<button class="nut phu nho"
          onclick="taiFile('/api/admin/xuat/ca-thi/${c.id}')">Ca ${thoat(c.ten)}</button>`).join("")}
      </div>
    </div>

    <div class="the">
      <h2>Thời hạn lưu ảnh bằng chứng</h2>
      <p class="mo">Mỗi ca có thời hạn riêng. Thao tác này chỉ xóa nội dung ảnh
        đã quá hạn; loại sự kiện, thời điểm và thời lượng vẫn được giữ
        để kiểm tra. Dữ liệu nghiên cứu không được dùng để huấn luyện
        mô hình nếu không có căn cứ và đồng thuận riêng.</p>
      <div class="hang">
        <div class="o"><label for="ca-don-anh">Chọn ca</label>
          <select id="ca-don-anh">${ca.map(c =>
            `<option value="${c.id}">${thoat(c.ten)} · ${c.so_ngay_luu_anh || 30} ngày</option>`).join("")}</select></div>
        <button class="phu" id="nut-don-anh">Dọn ảnh hết hạn</button>
      </div>
    </div>

    <div class="the">
      <h2>Dọn dữ liệu tập dượt</h2>
      <div class="canh-bao-o">Xóa bài làm, mốc giám sát và phán đoán của một ca,
        giữ lại đề và ca thi. Dùng sau khi chạy thử để dữ liệu tập dượt không lẫn
        vào dữ liệu nghiên cứu thật. Không khôi phục lại được.</div>
      <div class="hang cach-nho">
        <div class="o"><label>Chọn ca cần dọn</label>
          <select id="ca-don" aria-label="Chọn ca cần dọn dữ liệu">${ca.map(c =>
            `<option value="${c.id}">${thoat(c.ten)}</option>`).join("")}</select></div>
        <button class="nguy" id="nut-don">Dọn dữ liệu ca này</button>
      </div>
    </div>`;

  document.getElementById("nut-so-sanh")?.addEventListener("click", soSanh);
  document.getElementById("nut-don-anh")?.addEventListener("click", donAnhHetHan);
  document.getElementById("nut-don")?.addEventListener("click", donDuLieu);
}

async function donAnhHetHan() {
  const caId = document.getElementById("ca-don-anh").value;
  try {
    const kq = await API.post(`/api/admin/ca-thi/${caId}/don-anh-het-han`, {});
    thongBao(`Đã dọn ${kq.so_anh_da_xoa} ảnh quá ${kq.so_ngay_luu_anh} ngày`, "xong");
  } catch (e) { thongBao(e.message, "loi"); }
}

async function soSanh() {
  const o = document.getElementById("kq-so-sanh");
  o.innerHTML = khungXuong(2);
  try {
    const kq = await API.get(`/api/stats/so-sanh-nhom?ca_tn=` +
      `${document.getElementById("ca-tn").value}&ca_dc=${document.getElementById("ca-dc").value}`);
    const k = kq.kiem_dinh;
    const yNghia = k.p !== null && k.p < 0.05;
    o.innerHTML = `
      <div class="cuon-ngang"><table>
        <thead><tr><th>Nhóm</th><th class="giua">Số em</th>
          <th class="giua">Trung bình số mốc</th><th class="giua">Độ lệch chuẩn</th></tr></thead>
        <tbody>
          <tr><td>Có giám sát</td><td class="giua">${kq.nhom_thuc_nghiem.n}</td>
            <td class="giua">${kq.nhom_thuc_nghiem.trung_binh}</td>
            <td class="giua">${kq.nhom_thuc_nghiem.do_lech_chuan}</td></tr>
          <tr><td>Đối chứng</td><td class="giua">${kq.nhom_doi_chung.n}</td>
            <td class="giua">${kq.nhom_doi_chung.trung_binh}</td>
            <td class="giua">${kq.nhom_doi_chung.do_lech_chuan}</td></tr>
        </tbody></table></div>
      <div class="canh-bao-o ${yNghia ? "luc" : "tim"} cach-nho">
        ${k.t === null ? "Chưa đủ dữ liệu để kiểm định."
          : `Kiểm định t: t = ${k.t}, df = ${k.df}, p = ${k.p}, Cohen d = ${k.d}.
             ${yNghia ? "Chênh lệch đạt ý nghĩa thống kê ở mức 0,05."
                      : "Chênh lệch chưa đạt ý nghĩa thống kê, thường do cỡ mẫu nhỏ."}`}
      </div>
      <p class="mo-nho">${thoat(kq.ghi_chu)}</p>`;
  } catch (e) {
    o.innerHTML = `<div class="canh-bao-o">${thoat(e.message)}</div>`;
  }
}

async function donDuLieu() {
  const ca_id = document.getElementById("ca-don").value;
  if (!await xacNhan("Xóa toàn bộ bài làm, mốc giám sát và phán đoán của ca này?",
                     "Xóa dữ liệu")) return;
  const kq = await API.xoa(`/api/admin/ca-thi/${ca_id}/du-lieu`);
  const d = kq.da_xoa;
  thongBao(`Đã xóa ${d.bai_lam} bài làm, ${d.moc_bat_thuong} mốc, ` +
           `${d.phan_doan} phán đoán`, "xong");
}

veChonMuc();
veMuc();
</script>
